<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#07060d" />
    <title>The Gamer's Room</title>
    <style>
      :root { color-scheme: dark; --bg: #07060d; --fg: #ece9ff; --muted: #9a94c4; --neon: #b14cff; --neon-2: #2de2e6; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 16px;
        background: radial-gradient(ellipse at 50% 30%, #1a0f33 0%, var(--bg) 70%);
        color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 32rem; }
      .tag { font: 600 0.75rem/1 ui-monospace, Consolas, monospace; letter-spacing: 0.3em; color: var(--neon-2); }
      h1 { margin: 1rem 0 0.5rem; font-size: clamp(2rem, 9vw, 3.25rem); letter-spacing: 0.04em; text-shadow: 0 0 18px var(--neon); }
      p { margin: 0 0 2rem; color: var(--muted); font-size: 1.05rem; line-height: 1.5; }
      .dots span { display: inline-block; width: 0.6rem; height: 0.6rem; margin: 0 0.25rem; border-radius: 50%; background: var(--neon); animation: pulse 1.2s infinite ease-in-out; }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
      a.btn {
        display: inline-block; margin-top: 2rem; padding: 0.85rem 1.6rem; border: 1px solid var(--neon); border-radius: 0.5rem;
        color: var(--fg); text-decoration: none; font-weight: 600; box-shadow: 0 0 14px rgb(177 76 255 / 0.35);
      }
      a.btn:hover, a.btn:focus-visible { background: rgb(177 76 255 / 0.18); outline: none; }
      @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 0.8; } }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">PLAYER 2 HAS ENTERED</div>
      <h1>THE GAMER'S ROOM</h1>
      <p>The level is still loading. Come back soon.</p>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <a class="btn" href="https://ahshika.github.io/">Visit my portfolio</a>
    </main>
  </body>
</html>
